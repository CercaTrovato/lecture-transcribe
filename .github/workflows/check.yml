name: Source checks
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  shared-logic:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      LT_PORT: '8786'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Configure isolated test storage on the runner
        run: python -c "import os; root=os.environ['RUNNER_TEMP']; f=open(os.environ['GITHUB_ENV'],'a',encoding='utf-8'); f.write('LT_DATA_DIR='+root+'/lt-data\nLT_TEST_TEMP='+root+'\n'); f.close()"
      - name: Install CPU dependencies only
        run: uv sync --extra test
      - name: Shared Python behaviour tests
        run: uv run python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Shared frontend syntax
        run: |
          node --check web/app.js
          node --check web/models.js
      - name: Desktop component integrity tests
        working-directory: desktop
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          npm ci
          npm test
