<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Lecture Transcribe · 初次配置</title>
<style>body{font:15px system-ui,sans-serif;background:#f3f5f9;color:#243247;margin:0;padding:60px}main{max-width:780px;margin:auto;background:white;border:1px solid #dce2ed;border-radius:16px;padding:30px}h1{font-size:24px}p{line-height:1.8;color:#53627a}.component{padding:16px;border:1px solid #dce2ed;border-radius:10px;margin:12px 0;display:flex;align-items:center;justify-content:space-between;gap:20px}button{border:0;border-radius:8px;background:#2864ea;color:white;padding:10px 16px;cursor:pointer}button:disabled{opacity:.5}progress{width:100%;height:18px}#message{white-space:pre-wrap;color:#ba3244}</style>
<main><h1>准备本地运行环境</h1><p>先下载应用需要的 Python 与推理运行组件。此步骤不安装任何模型；进入应用后，每个模型都由你主动选择下载或卸载。安装附加组件会安全关闭空闲后台，之后重新进入应用；正在录音或处理时不会强制中断。</p><p id="platform"></p><div id="components"></div><progress id="progress" max="100" value="0"></progress><p id="progress-label"></p><button id="cancel">取消组件下载</button> <button id="launch">进入应用</button><p id="message" role="status"></p></main>
<script>
const element=id=>document.getElementById(id);
async function update(){const status=await window.desktop.runtimeStatus();element('platform').textContent=`设备平台：${status.platform}`;element('message').textContent=status.error||'';element('components').innerHTML='';for(const component of status.components){const row=document.createElement('div');row.className='component';const label=document.createElement('span');label.textContent=`${component.id.startsWith('cuda-')?'NVIDIA 加速（选装）':'基础运行环境（必要）'} · ${(component.bytes/1e6).toFixed(1)} MB${component.installed?' · 已安装':''}`;const button=document.createElement('button');button.textContent=component.installed?'已安装':'下载并安装';button.disabled=component.installed;button.onclick=async()=>{button.disabled=true;const result=await window.desktop.installRuntime(component.id);await update();if(!result.ok)element('message').textContent=result.error;};row.append(label,button);element('components').append(row);}element('launch').disabled=!status.components.some(c=>c.id.startsWith('cpu-')&&c.installed);}
window.desktop.onProgress(value=>{element('progress').value=value.total?value.bytes*100/value.total:0;element('progress-label').textContent=`${{downloading:'正在下载',verifying:'完整性校验',installed:'安装完成'}[value.state]||value.state} · ${(value.bytes/1e6).toFixed(1)} / ${(value.total/1e6).toFixed(1)} MB`;});
element('cancel').onclick=()=>window.desktop.cancelRuntime();element('launch').onclick=async()=>{const result=await window.desktop.launch();if(!result.ok)element('message').textContent=result.error;};update();
</script></html>
