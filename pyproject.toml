[project]
name = "lecture-transcribe"
version = "0.1.0"
description = "Local recording, transcription and optional bilingual translation"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "faster-whisper>=1.2.1",
    "imageio-ffmpeg>=0.6.0",
    "python-multipart>=0.0.32",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cuda-runtime-cu12>=12.9; sys_platform != 'darwin'",
    "nvidia-cublas-cu12>=12.9.2.10; sys_platform != 'darwin'",
    "nvidia-cudnn-cu12>=9.26.0.51; sys_platform != 'darwin'",
]
test = ["httpx>=0.28.1"]
metal = ["pywhispercpp>=1.5.1; sys_platform == 'darwin'"]
